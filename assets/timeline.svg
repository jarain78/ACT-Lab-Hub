<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320">
  <rect width="1400" height="320" fill="#0d1117"/>
  <text x="70" y="55" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">ACT-Lab — Development Timeline</text>
  <text x="70" y="88" fill="#8b949e" font-family="Arial, sans-serif" font-size="16">2025 → September 2026</text>
  <line x1="110" y1="175" x2="1290" y2="175" stroke="#58a6ff" stroke-width="5"/>
  <g font-family="Arial, sans-serif">
    <circle cx="150" cy="175" r="12" fill="#58a6ff"/>
    <text x="110" y="135" fill="#f0f6fc" font-size="18" font-weight="700">2025</text>
    <text x="80" y="215" fill="#c9d1d9" font-size="14">Start with ACT</text>
    <text x="80" y="235" fill="#8b949e" font-size="12">Demonstrations + datasets</text>

    <circle cx="430" cy="175" r="12" fill="#58a6ff"/>
    <text x="375" y="135" fill="#f0f6fc" font-size="18" font-weight="700">2026 · H1</text>
    <text x="335" y="215" fill="#c9d1d9" font-size="14">Bimanual integration</text>
    <text x="335" y="235" fill="#8b949e" font-size="12">Teleoperation + perception</text>

    <circle cx="705" cy="175" r="12" fill="#58a6ff"/>
    <text x="650" y="135" fill="#f0f6fc" font-size="18" font-weight="700">Jul 2026</text>
    <text x="615" y="215" fill="#c9d1d9" font-size="14">ACT-CVAE Online</text>
    <text x="600" y="235" fill="#8b949e" font-size="12">Continual learning</text>

    <circle cx="970" cy="175" r="12" fill="#58a6ff"/>
    <text x="915" y="135" fill="#f0f6fc" font-size="18" font-weight="700">Aug 2026</text>
    <text x="875" y="215" fill="#c9d1d9" font-size="14">Residual RL + Edge</text>
    <text x="875" y="235" fill="#8b949e" font-size="12">SAC + model export</text>

    <circle cx="1245" cy="175" r="12" fill="#58a6ff"/>
    <text x="1185" y="135" fill="#f0f6fc" font-size="18" font-weight="700">Sep 2026</text>
    <text x="1130" y="215" fill="#c9d1d9" font-size="14">Visual Pipeline</text>
    <text x="1095" y="235" fill="#8b949e" font-size="12">ROS2 · sensors · deployment</text>
